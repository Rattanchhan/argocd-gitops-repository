apiVersion: v1
kind: ServiceAccount
metadata: {name: headlamp-viewer, namespace: headlamp}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: headlamp-viewer, namespace: react-dev}
rules:
  - apiGroups: ["", apps, batch, networking.k8s.io]
    resources: [pods, pods/log, services, configmaps, deployments, replicasets, jobs, cronjobs, ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: headlamp-viewer, namespace: react-dev}
subjects: [{kind: ServiceAccount, name: headlamp-viewer, namespace: headlamp}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: headlamp-viewer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: headlamp-viewer, namespace: react-prod}
rules:
  - apiGroups: ["", apps, batch, networking.k8s.io]
    resources: [pods, pods/log, services, configmaps, deployments, replicasets, jobs, cronjobs, ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: headlamp-viewer, namespace: react-prod}
subjects: [{kind: ServiceAccount, name: headlamp-viewer, namespace: headlamp}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: headlamp-viewer}

